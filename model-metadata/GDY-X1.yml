methods: "Quantile average of a pooled baseline and a negative binomial whose mean uses horizon-decayed in-season signal and bird positivity, with dispersion estimated on post-origin months."
data_inputs: "Confirmed human West Nile virus cases by county and week of report, CDPH open data portal (data.chhs.ca.gov), 2006-2026, aggregated to the six hub regions and to calendar months. Week-to-month assignment follows the CDPH convention (majority of days in the week; confirmed by CDPH modeling team, Aug 2026). Region population from the 2023 county estimates, used as a log offset. VectorSurv dead bird surveillance (github.com/vectorsurv/ca-wnv-forecasting-challenge), snapshot 2026-08-15: share of dead birds testing positive over complete months of the current season."
methods_long: >
  Two components are averaged quantile by quantile (Vincent averaging). The first
  is a pooled baseline: the quantile average of a negative binomial fitted on the full
  history and one fitted on the trailing six years, both with month and region fixed
  effects and a log-population offset. The second is a negative binomial whose mean
  combines two measured refinements of the in-season signal - the effect of year-to-date
  cases decays with forecast horizon, and the share of positive dead birds carries
  information where the case signal is still blind - and whose dispersion is estimated
  on months later than the origin month rather than on the whole year, since peak months
  otherwise inflate it. This is the best-calibrated upper tail among the models we tested (4.1-9.7% of
  cells above the nominal 95th percentile against a reference point of 3.9-4.2% for a
  perfectly calibrated count model), and it pays for that on strong seasons, where the
  pooled layer halves the in-season signal. Both properties are measured, not asserted.
ensemble_of_models: true
